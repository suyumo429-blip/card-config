<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>卡密验证 · 动态配置</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI','PingFang SC',Roboto,sans-serif}
        body{min-height:100vh;background:linear-gradient(145deg,#e9eef4,#d0dbe8);display:flex;justify-content:center;align-items:center;padding:20px}
        .card{max-width:500px;width:100%;background:rgba(255,255,255,0.96);border-radius:48px;box-shadow:0 20px 35px -12px rgba(0,0,0,0.2);padding:32px 28px 40px}
        h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#1e4a6e,#0f2c3f);background-clip:text;-webkit-background-clip:text;color:transparent;text-align:center}
        .sub{text-align:center;color:#5a6f82;font-size:.9rem;margin-bottom:32px;padding-bottom:10px;border-bottom:1px solid #e2e8f0}
        .verify-area{background:#ffffffcc;border-radius:32px;padding:20px;margin-bottom:10px}
        .code-input{width:100%;padding:14px 18px;border:1.5px solid #cfdfed;border-radius:34px;font-size:1rem;outline:none}
        .code-input:focus{border-color:#3b82f6}
        .verify-btn{width:100%;background:linear-gradient(105deg,#1f5e8c,#133e5a);border:none;padding:14px;color:white;border-radius:44px;font-weight:600;margin-top:16px;cursor:pointer}
        .error-msg{margin-top:16px;background:#fee2e2;color:#b91c1c;padding:10px;border-radius:40px;font-size:.85rem;text-align:center;display:none}
        .error-msg.show{display:block}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;visibility:hidden;opacity:0;transition:0.2s}
        .modal-overlay.active{visibility:visible;opacity:1}
        .modal-container{background:white;width:90%;max-width:460px;border-radius:44px;animation:modalPop 0.25s}
        @keyframes modalPop{from{transform:scale(0.94);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-header{padding:20px 24px 8px;display:flex;justify-content:space-between;border-bottom:1px solid #ecf3f9}
        .modal-header h3{font-size:1.4rem;background:linear-gradient(135deg,#1f3e54,#2c6288);background-clip:text;-webkit-background-clip:text;color:transparent}
        .modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:#8aa0b0}
        .modal-body{padding:28px;max-height:60vh;overflow-y:auto}
        .dynamic-content{background:#f6fafd;border-radius:28px;padding:20px;white-space:pre-wrap;word-break:break-word}
        .modal-footer{padding:8px 24px 24px;display:flex;justify-content:flex-end}
        .modal-ok-btn{background:#2c5f8a;border:none;padding:10px 26px;border-radius:44px;color:white;font-weight:600;cursor:pointer}
        footer{text-align:center;margin-top:28px;font-size:0.7rem;color:#6b8aa3}
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 卡密验证</h1>
    <div class="sub">输入卡密获取专属内容</div>
    <div class="verify-area">
        <input type="password" id="cardCodeInput" class="code-input" placeholder="请输入卡密" autocomplete="off">
        <button id="verifyBtn" class="verify-btn">验证并弹窗</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
    <footer>⚙️ 内容由管理员动态更新</footer>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3>📬 专属消息</h3><button class="modal-close" id="modalCloseBtn">&times;</button></div>
        <div class="modal-body"><div id="modalDynamicText" class="dynamic-content"></div></div>
        <div class="modal-footer"><button id="modalOkBtn" class="modal-ok-btn">确 定</button></div>
    </div>
</div>

<script>
    // ⚠️ 重要：请将下面链接中的 "你的用户名" 和 "你的仓库名" 替换成你自己的
    const CONFIG_URL = "https://raw.githubusercontent.com/jiangyu/card-validator/main/cards.json";
    // 例子：https://raw.githubusercontent.com/johndoe/card-validator/main/cards.json
    // ===============================================================

    let cardsData = {};

    async function loadRemoteConfig() {
        try {
            const response = await fetch(CONFIG_URL, { cache: "no-cache" });
            if (!response.ok) throw new Error("HTTP error");
            const data = await response.json();
            if (data && typeof data === "object") {
                cardsData = data;
                console.log("配置加载成功", cardsData);
                return true;
            } else {
                throw new Error("无效的JSON格式");
            }
        } catch (error) {
            console.error("加载远程配置失败:", error);
            cardsData = { "secure2026": "⚠️ 配置加载失败，请稍后重试或联系管理员。" };
            showTemporaryMessage("⚠️ 配置加载失败，使用备用卡密", true);
            return false;
        }
    }

    let toastTimer = null;
    function showTemporaryMessage(msg, isError = false) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = msg;
        errorDiv.style.background = isError ? "#fee2e2" : "#e0f2e9";
        errorDiv.style.color = isError ? "#b91c1c" : "#1e6f3f";
        errorDiv.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => errorDiv.classList.remove('show'), 2500);
    }

    function verifyAndShowModal() {
        const inputCode = document.getElementById('cardCodeInput').value.trim();
        if (inputCode === "") {
            showTemporaryMessage("❌ 请输入卡密", true);
            return;
        }
        const content = cardsData[inputCode];
        if (!content) {
            showTemporaryMessage("🔒 卡密无效，没有对应的内容", true);
            document.getElementById('cardCodeInput').value = "";
            return;
        }
        document.getElementById('modalDynamicText').innerText = content;
        document.getElementById('customModal').classList.add('active');
        document.getElementById('cardCodeInput').value = "";
    }

    function closeModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    function bindEvents() {
        document.getElementById('verifyBtn').addEventListener('click', verifyAndShowModal);
        document.getElementById('cardCodeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyAndShowModal();
        });
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('modalOkBtn').addEventListener('click', closeModal);
        document.getElementById('customModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('customModal')) closeModal();
        });
    }

    async function init() {
        bindEvents();
        await loadRemoteConfig();
    }
    init();
</script>
</body>
</html>
